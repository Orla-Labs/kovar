name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Run the full CI suite first — release won't publish unless all checks pass
  ci:
    uses: ./.github/workflows/ci.yml

  # The OIDC token (id-token: write) can publish to npm, so this job runs no
  # third-party actions and no dependency install scripts.
  publish:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public --ignore-scripts

  github-release:
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
