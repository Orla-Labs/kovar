name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:browser
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines floor (>=20.19) plus current LTS lines
        node-version: ['20.19', 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build:browser
      - run: npm run test

  integration-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # peer floor (>=1.40.0), a mid-range release, and the latest release
        playwright-version: ['1.40.0', '1.52.0', '1.65.0']
        node-version: [22]
        include:
          - playwright-version: '1.65.0'
            node-version: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save @playwright/test@${{ matrix.playwright-version }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  package:
    # Tests above run against src/ and dist/ inside the repo. This job installs
    # the packed tarball into an empty project, the way users get it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npx --yes publint@0.3 --strict
      - run: npx --yes @arethetypeswrong/cli@0.18 --pack . --profile node16 --ignore-rules false-export-default
      - run: scripts/smoke-pack.sh 1.65.0

  action:
    # Exercise the composite GitHub Action end to end against a local fixture server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: mv "$(npm pack --silent | tail -1)" kovar.tgz
      - name: Start fixture server
        run: |
          cat > "$RUNNER_TEMP/serve.mts" <<'TS'
          import { startServer } from "${{ github.workspace }}/tests/integration/fixtures/test-server.ts";
          const { url } = await startServer(4789);
          console.log(url);
          TS
          nohup npx tsx "$RUNNER_TEMP/serve.mts" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:4789/secure >/dev/null && break; sleep 1; done
      - name: Run action against a secure page
        id: secure
        uses: ./.github/actions/security-check
        with:
          url: http://localhost:4789/secure
          comment: "false"
          kovar-package: ./kovar.tgz
      - name: Run action against an insecure page (must fail)
        id: insecure
        continue-on-error: true
        uses: ./.github/actions/security-check
        with:
          url: http://localhost:4789/insecure
          comment: "false"
          kovar-package: ./kovar.tgz
      - name: Assert outputs
        run: |
          test "${{ steps.secure.outputs.passed }}" = "true"
          test "${{ steps.insecure.outcome }}" = "failure"

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests, package, action]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v6
        with:
          name: kovar-package
          path: orlalabs-kovar-*.tgz
